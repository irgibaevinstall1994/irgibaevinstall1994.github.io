<!-- ==================== PORTFOLIO ==================== -->

<section class="section portfolio" id="portfolio">

    <div class="section-heading">
        <p class="section-label">PORTFOLIO</p>
        <h2>Selected work.</h2>
    </div>

    <div class="portfolio-slider">

        <!-- LEFT ARROW -->
        <button
            class="portfolio-arrow portfolio-prev"
            type="button"
            aria-label="Previous projects"
        >
            &#8592;
        </button>

        <!-- SLIDER WINDOW -->
        <div class="portfolio-viewport">

            <div class="portfolio-track">

                <div class="portfolio-slide">
                    <img src="portfolio/1.png" alt="Installation project 1">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/2.png" alt="Installation project 2">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/3.png" alt="Installation project 3">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/4.png" alt="Installation project 4">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/5.png" alt="Installation project 5">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/6.png" alt="Installation project 6">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/7.png" alt="Installation project 7">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/8.png" alt="Installation project 8">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/9.png" alt="Installation project 9">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/10.png" alt="Installation project 10">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/11.png" alt="Installation project 11">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/12.png" alt="Installation project 12">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/13.png" alt="Installation project 13">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/14.png" alt="Installation project 14">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/15.png" alt="Installation project 15">
                </div>

                <div class="portfolio-slide">
                    <img src="portfolio/16.png" alt="Installation project 16">
                </div>

            </div>

        </div>

        <!-- RIGHT ARROW -->
        <button
            class="portfolio-arrow portfolio-next"
            type="button"
            aria-label="Next projects"
        >
            &#8594;
        </button>

    </div>

    <div class="portfolio-progress">
        <span id="portfolioCurrent">01</span>
        <span class="portfolio-progress-line"></span>
        <span id="portfolioTotal">16</span>
    </div>

</section>
